name: "🔄 CD · Snapshot"

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: viamiora-merge-${{ github.sha }}
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-24.04
    outputs:
      value: ${{ steps.version.outputs.value }}
    steps:
      - id: version
        shell: sh
        run: |
          set -eu
          value=$(date -u +%Y.%m.%d | awk -F. '{ printf "%d.%d.%d-SNAPSHOT\n", $1, $2, $3 }')
          printf 'value=%s\n' "$value" >> "$GITHUB_OUTPUT"

  build:
    needs: version
    uses: ./.github/workflows/macos-build.yml
    with:
      ref: ${{ github.sha }}
      version: ${{ needs.version.outputs.value }}
